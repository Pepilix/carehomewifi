# ---------------------------------------------------------------------------
# CareHomeWiFi.com — site settings
# Built by GitHub Pages (Jekyll). Edit contact details and the form
# destination here; every page picks them up.
# ---------------------------------------------------------------------------

title: CareHomeWiFi.com
# Business name used in page titles, social cards and structured data.
brand_name: CareHomeWiFi
tagline: Specialist WiFi & network infrastructure for UK care homes

# ---------------------------------------------------------------------------
# Brand assets. Paths are relative to the site root. Replace the files (or
# update the paths) when the final logo and icons arrive — see BRAND-ASSETS.md.
# Leave an entry empty ("") to stop it being referenced.
# ---------------------------------------------------------------------------
brand:
  logo: "/assets/brand/carehomewifi-logo-horizontal.png"   # header, on light backgrounds
  logo_reverse: "/assets/brand/carehomewifi-logo-light.png" # footer, on navy
  logo_width: 520                                  # intrinsic size of the files above
  logo_height: 108
  logo_schema: "/assets/brand/carehomewifi-logo-stacked.png" # Organization schema logo
  favicon_svg: ""                                  # add when vector artwork is supplied
  favicon_ico: "/favicon.ico"                      # 16, 32 and 48px in one file
  favicon_png: true                                # /favicon-16x16.png, -32x32, -48x48
  apple_touch_icon: "/apple-touch-icon.png"
  icon_192: "/android-chrome-192x192.png"
  icon_512: "/android-chrome-512x512.png"
  # Default image for social shares (Open Graph / X).
  og_image: "/assets/brand/og-default.jpg"
  og_image_width: 1200
  og_image_height: 630
  og_image_alt: "CareHomeWiFi logo over Bradshaw Lodge, a new-build LNT Care Developments care home"
description: >-
  Specialist WiFi and network infrastructure for UK care homes — new-build
  developments, upgrades to existing homes and ongoing support. Part of
  the Inspire Group.
url: "https://carehomewifi.com"
baseurl: ""
lang: en-GB
locale: en_GB

# Contact details shown across the site
phone: "0330 430 3490"
phone_link: "+443304303490"
# Email shown across the site (hello@ is hosted on Titan; tested 20 Oct 2026).
email: "hello@carehomewifi.com"
address:
  line1: "Unit 661c, Thorp Arch Estate"
  town: "Wetherby"
  postcode: "LS23 7FF"
parent:
  legal_name: "Inspire Audio Visual Ltd"
  company_number: "08332115"
  registered_office: "Unit 661c, Street 3, Thorp Arch Estate, Wetherby, LS23 7FF"
  name: "Inspire Group"
  url: "https://www.inspire-av.com/"

# Sister sites in the Inspire group, linked from the footer.
# Inspire Electrical points at its test address until inspire-electrical.com is live.
group_sites:
  - name: "Inspire"
    url: "https://trustinspire.com/"
  - name: "Inspire Audio Visual"
    url: "https://www.inspire-av.com/"
  - name: "Inspire Electrical"
    url: "https://pepilix.github.io/inspire-electrical/"

# Enquiry forms post here (FormSubmit). The first submission from the live
# domain sends an activation email to this address, which must be confirmed.
form_endpoint: "https://formsubmit.co/ajax/jonathan.a@inspire-av.com"

google_site_verification: "rpIIRBk_5GeOTAxsVPoGxJIO_kPPLuaqXh_SiOBkx3s"

# Google Analytics 4. Only loaded after a visitor accepts analytics cookies
# in the consent banner (UK PECR). Leave empty to switch analytics off.
ga_measurement_id: "G-WTW1BT43N4"

# While true, unconfirmed facts are highlighted on the page with a dashed
# "Confirm" marker. Set to false only once CONTENT-CHECKLIST.md is complete.
show_confirm_markers: false

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

collections:
  projects:
    output: true
    permalink: /projects/:name/
  insights:
    output: true
    permalink: /insights/:name/

defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: insights }
    values: { layout: insight }

permalink: pretty
future: true
markdown: kramdown
kramdown:
  auto_ids: true

exclude:
  - README.md
  - CONTENT-CHECKLIST.md
  - SEO-MAP.md
  - BRAND-ASSETS.md
  - tools/
  - .github/
