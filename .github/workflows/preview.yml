# Builds the site with the same Jekyll setup GitHub Pages uses and attaches
# the result as a downloadable artifact. Runs on the redesign branch only,
# so it never touches the live site (which GitHub Pages builds from main).
name: Preview build

on:
  push:
    branches: [redesign]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
