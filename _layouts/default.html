<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.body_class }}{% unless site.show_confirm_markers %} hide-confirm{% endunless %}"{% if site.ga_measurement_id != "" %} data-ga="{{ site.ga_measurement_id }}"{% endif %}>
<a href="#main" class="skip-link">Skip to content</a>
{% include header.html %}
<main id="main">
  {% if page.url != "/" %}{% include breadcrumbs.html %}{% endif %}

</main>
{% include footer.html %}
{% include consent.html %}
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
